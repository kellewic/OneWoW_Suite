# OneWoW Suite — pre-commit configuration
#
# Install:
#   pip install pre-commit
#   python -m pre_commit install
#
# Run manually against all files:
#   python -m pre_commit run --all-files
#
# Bypass for a single commit (use sparingly):
#   git commit --no-verify

# `(.*/)?Libs/` rather than `Libs/`: these are anchored regexes, and every
# vendored tree in this repo lives at OneWoW/Libs/, never at the root. A
# root-anchored `Libs/` silently matched nothing, so `run --all-files` failed on
# embedded libraries that AGENTS.md forbids editing.
exclude: |
  (?x)^(
    \.wow_docs/
    | (.*/)?Libs/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json

  - repo: local
    hooks:
      - id: no-g-literal-access
        name: No _G.<name> literal access in Lua
        description: |
          Forbids `_G.SomeGlobal` (literal field access on _G).
          Allowed: bare global name, or `_G[expr]` for computed keys.
          See .cursor/rules/OneWoW-Lua-Conventions.mdc.
        entry: python bin/run_devs.py check_no_g_literal.py
        language: python
        types: [lua]
        # Mirror .luarc.json workspace.ignoreDir — these are reference / vendored / generated.
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: theme-color-bypass
        name: Theme color literal bypass (warn-only)
        description: |
          Warns when widget color APIs use hardcoded RGB literals instead of
          OneWoW_GUI:GetThemeColor. See OneWoW/Docs/GUI.md §Theme System and
          bin/check_theme_color_bypass.py (WARN_ONLY=True; does not block).
        entry: python bin/run_devs.py check_theme_color_bypass.py
        language: python
        types: [lua]
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: no-data-manager-bypass
        name: No cross-load-unit SavedVariables access in Lua
        description: |
          Forbids touching another load unit's SavedVariables global
          (e.g. a Catalog file reading `OneWoW_AltTracker_Storage_DB`, or
          the AltTracker hub iterating `OneWoW_AltTracker_Character_DB`).
          Ownership is derived from each TOC's SavedVariables lines; use the
          owner unit's public `OneWoW_<Unit>_API` instead. Phase 0 is
          warn-only (never blocks). See OneWoW/Docs/ARCHITECTURE.md §6/§7
          and the hook docstring.
        entry: python bin/run_devs.py check_no_data_manager_bypass.py
        language: python
        types: [lua]
        # Same reference / vendored / generated trees as no-g-literal-access,
        # plus command-line dev tools (run via standalone Lua, mock runtime) that
        # legitimately poke raw SavedVariables.
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: no-namespace-publish
        name: No namespace publish / global-surface anti-patterns in Lua
        description: |
          Flags hand namespace publish (`OneWoW_<Unit> = ns`, `_G[...] = ns`,
          `_G[...] = OneWoW` / `OneWoW_*`), renamed vararg namespaces, `ns.addon`
          hops, and `.db` on published globals. Warn-only (grandfather list); see
          OneWoW/Docs/ARCHITECTURE.md §6.1.
        entry: python bin/run_devs.py check_no_namespace_publish.py
        language: python
        types: [lua]
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: no-suite-lifecycle-events
        name: No lifecycle RegisterEvent in orchestrated OneWoW units
        description: |
          Forbids RegisterEvent on ADDON_LOADED, PLAYER_LOGIN, or
          PLAYER_ENTERING_WORLD in orchestrated load units. Use core
          lifecycle hooks instead. See OneWoW/Docs/ARCHITECTURE.md §3.7.
        entry: python bin/run_devs.py check_suite_lifecycle.py
        language: python
        types: [lua]
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: no-settings-bypass
        name: No direct db.global.settings access in Lua
        description: |
          Forbids reading or writing the OneWoW settings tree
          (`db.global.settings`, including aliased access) outside
          SettingsFeatureRegistry.lua / Database.lua. Use the
          SettingsFeatureRegistry funnel. See OneWoW/Docs/ARCHITECTURE.md §8.5.
        entry: python bin/run_devs.py check_no_settings_bypass.py
        language: python
        types: [lua]
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: restriction-funnel
        name: No direct combat/restriction/secret API calls in Lua
        description: |
          Forbids InCombatLockdown / C_RestrictedActions.GetAddOnRestrictionState /
          C_RestrictedActions.IsAddOnRestrictionActive / issecretvalue / issecrettable
          outside Restriction.lua. Route through OneWoW.Restriction.IsProtectedActionBlocked()
          (secure-frame / protected actions; excl. Map), IsAddonRestricted() (broad gate, only
          when the action must also stand down in a restricted map), IsInCombat() (combat-only
          UX/perf), or IsSecret() (secret values). See OneWoW/Docs/ARCHITECTURE.md.
        entry: python bin/run_devs.py check_no_restriction_bypass.py
        language: python
        types: [lua]
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: core-event-funnel
        name: No registering core-owned events outside their funnel owner
        description: |
          Forbids string-literal RegisterEvent("<core-owned-event>") outside the
          one service that owns it (registry in bin/check_no_core_event_bypass.py:
          MERCHANT_* -> Merchant.lua). Consume the funnel's scan/show/closed
          channels (OneWoW.Merchant) or IsMerchantOpen() instead. See
          OneWoW/Docs/MERCHANT.md and OneWoW/Docs/ARCHITECTURE.md §3.10 / §8.8.
        entry: python bin/run_devs.py check_no_core_event_bypass.py
        language: python
        types: [lua]
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: no-api-existence-guards
        name: No defensive C_* / Enum API existence guards in Lua
        description: |
          Forbids multi-version-style existence checks on C_* namespaces, Enum
          tables, FlagsUtil, and ItemLocation (e.g. C_Item and C_Item.GetItemInfo).
          OneWoW targets Retail 12+ only — call APIs directly. See
          .cursor/rules/No-Defensive-Guards.mdc.
        entry: python bin/run_devs.py check_no_api_existence_guards.py
        language: python
        types: [lua]
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
          )

      - id: no-raw-loadaddon
        name: No raw LoadAddOn outside the core loader funnel
        description: |
          Forbids C_AddOns.LoadAddOn / UIParentLoadAddOn outside
          OneWoW/Core/AddonLoader.lua and OneWoW/Core/Lifecycle.lua.
          Raw loads bypass soft opt-out, combat deferral, and lifecycle
          dispatch. Use EnsureLoaded / WithAddon / BringUp. See
          OneWoW/Docs/ARCHITECTURE.md.
        entry: python bin/run_devs.py check_no_raw_loadaddon.py
        language: python
        types: [lua]
        # Same reference / vendored / generated trees as no-g-literal-access.
        # OneWoW_Utility_DevTool/Data/LuaSyntax.lua is a TEMPORARY exclusion:
        # its raw pcall(C_AddOns.LoadAddOn, ...) is being fixed in the DevTool
        # rework — remove that line once it lands.
        exclude: |
          (?x)^(
            (.*/)?Libs/
            | \.lua-defs/
            | \.wow_docs/
            | \.vscode/
            | \.releases/
            | OneWoW_Bags/API/Examples/
            | OneWoW_Utility_DevTool/Data/LuaSyntax\.lua
          )

      - id: no-suite-internal-optionaldeps
        name: No suite-internal OptionalDeps in TOC files
        description: |
          Forbids OneWoW_* entries in ## OptionalDeps (bypasses soft
          opt-out). Use EnsureLoaded/WithAddon instead. See
          OneWoW/Docs/ARCHITECTURE.md §2.
        entry: python bin/run_devs.py check_toc_optional_deps.py
        language: python
        files: \.toc$

      - id: manifest-catalog-alignment
        name: ModuleManifest ↔ FirstRun.CATALOG consumer-graph alignment
        description: |
          Keeps ownership (ModuleManifest.stores / parentRequiredStores /
          STORE_LABEL_KEYS) and consumer pulls (FirstRun.CATALOG.datastores)
          consistent without requiring them to be identical. Also checks
          parent-required TOC RequiredDeps. See ARCHITECTURE.md §4.1.
        entry: python bin/run_devs.py check_manifest_catalog_alignment.py
        language: python
        pass_filenames: false
        files: |
          (?x)^(
            OneWoW/Core/(AddonLoader|FirstRunWizard)\.lua
            | OneWoW_[^/]+/OneWoW_[^/]+\.toc
          )$

      - id: no-per-addon-media
        name: No per-addon Media folders outside OneWoW hub
        description: |
          Forbids OneWoW_*/Media/ trees. All suite media lives under
          OneWoW/Media/ (shared root or OneWoW/Media/<AddonName>/
          subfolders). Use OneWoW_GUI.Constants.MEDIA_BASE in Lua.
          See OneWoW/Docs/GUI.md (Media assets).
        entry: python bin/run_devs.py check_no_per_addon_media.py
        language: python
        pass_filenames: false
        always_run: true

      - id: third-party-licenses
        name: Vendored Libs and fonts have license rows
        description: |
          Every Libs/<name>/ path must appear in THIRD_PARTY.md; every
          bundled font filename in FONT_LICENSES.txt. See
          .cursor/rules/OneWoW-Third-Party-Licenses.mdc.
        entry: python bin/run_devs.py check_third_party_licenses.py
        language: python
        pass_filenames: false
        always_run: true

      - id: module-credits
        name: Community QoL module authors are in MODULE_CREDITS.md
        description: |
          Non-team author strings in Modules/external/<id>/module.lua
          must have a matching MODULE_CREDITS.md row. See LICENSE.md.
        entry: python bin/run_devs.py check_module_credits.py
        language: python
        pass_filenames: false
        always_run: true

      - id: catdb-lua-parse
        name: CatDB generated Lua parses
        description: |
          Parses OneWoW_CatDB_*/Data/*.lua and DataExtra/*.lua shards so a truncated or
          unclosed table cannot ship. Same parser as bin/catdb_validate.py.
        entry: python bin/run_devs.py check_catdb_lua.py
        language: python
        files: ^OneWoW_CatDB_[^/]+/(Data|DataExtra)/.*\.lua$

      - id: locale-parity
        name: Locale key parity, format specifiers, and duplicate keys
        description: |
          For each changed Locales/ scope, verifies every locale against its
          enUS.lua: key parity (missing/extra), matching printf specifiers
          (%s/%d/%d%%), and no duplicate keys (duplicate-index). A changed
          enUS.lua re-checks all siblings. See OneWoW/Docs/LOCALES.md.
        entry: python bin/run_devs.py locale_verify.py
        language: python
        files: (^|/)Locales/.*\.lua$

      - id: locale-encoding
        name: Locale values are real UTF-8 (not CP1252 mojibake)
        description: |
          For each changed Locales/*.lua file, checks Register() string values
          for Windows-1252 mojibake of UTF-8 (e.g. ÐŸÐ¾Ñ‡Ñ‚Ð° instead of
          Почта). Comments are ignored. See OneWoW/Docs/LOCALES.md.
        entry: python bin/run_devs.py check_locale_encoding.py
        language: python
        files: (^|/)Locales/.*\.lua$

      - id: report-nearby-off
        name: VersionCheck REPORT_NEARBY must ship false
        description: |
          OneWoW/Core/VersionCheck.lua must keep
          `local REPORT_NEARBY = false`. The nearby chat report is local-only.
        entry: python bin/run_devs.py check_report_nearby_off.py
        language: python
        files: ^OneWoW/Core/VersionCheck\.lua$

      - id: tooltip-globalstrings-patterns
        name: TooltipScanner GlobalStrings pattern coverage
        description: |
          Verifies ITEM_SPELL_CHARGES converts to a usable search pattern in
          all 11 Blizzard GlobalStrings locales (|4 and plain %d forms), and
          that USE_COLON / equip / unique globals exist and are non-empty.
          See OneWoW/Docs/TOOLTIP_SCANNER.md and bin/check_tooltip_patterns.py.
        entry: python bin/run_devs.py check_tooltip_patterns.py
        language: python
        pass_filenames: false
        files: |
          (?x)^(
            OneWoW/Services/TooltipScanner\.lua|
            bin/check_tooltip_patterns\.py|
            \.wow_docs/blizzard-interface-resources/Resources/GlobalStrings/.*\.lua$
          )
